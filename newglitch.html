<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STALKER Webcam FX</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    pointer-events: none;
  }

  .layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Легкий зеленый общий тон */
  .tint {
    background:
      radial-gradient(circle at 50% 50%,
        rgba(120,255,120,0.04) 0%,
        rgba(120,255,120,0.025) 35%,
        rgba(120,255,120,0.01) 60%,
        transparent 100%);
    mix-blend-mode: screen;
    opacity: 0.9;
  }

  /* Scanlines */
  .scanlines {
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(120,255,120,0.08) 0px,
        rgba(120,255,120,0.08) 1px,
        transparent 2px,
        transparent 4px
      );
    opacity: 0.22;
    animation: scanDrift 7s linear infinite;
    mix-blend-mode: screen;
  }

  /* Мелкий шум */
  .noise {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10) 0 1px, transparent 1.6px),
      radial-gradient(circle at 70% 60%, rgba(120,255,120,0.08) 0 1px, transparent 1.7px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.05) 0 1px, transparent 1.5px),
      radial-gradient(circle at 85% 20%, rgba(120,255,120,0.08) 0 1px, transparent 1.5px);
    background-size: 180px 120px, 220px 160px, 200px 140px, 160px 130px;
    opacity: 0.08;
    animation: noiseShift 0.35s steps(2) infinite;
    mix-blend-mode: screen;
  }

  /* Радиационный туман */
  .fog {
    background:
      radial-gradient(circle at 15% 35%, rgba(120,255,120,0.08) 0%, transparent 32%),
      radial-gradient(circle at 75% 30%, rgba(120,255,120,0.06) 0%, transparent 28%),
      radial-gradient(circle at 50% 75%, rgba(120,255,120,0.05) 0%, transparent 34%);
    opacity: 0.38;
    filter: blur(18px);
    animation: fogMove 12s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }

  /* Виньетка */
  .vignette {
    background:
      radial-gradient(circle at center,
        transparent 48%,
        rgba(0,0,0,0.10) 72%,
        rgba(0,0,0,0.22) 100%);
  }

  /* HUD рамки */
  .hud {
    opacity: 0.22;
    mix-blend-mode: screen;
  }

  .hud::before,
  .hud::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(120,255,120,0.20);
    filter: drop-shadow(0 0 6px rgba(120,255,120,0.15));
  }

  .hud::before {
    inset: 18px;
    clip-path: polygon(
      0 18px, 18px 0, calc(100% - 18px) 0, 100% 18px,
      100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px)
    );
  }

  .hud::after {
    inset: 36px;
    opacity: 0.45;
  }

  /* Угловые метки */
  .corners {
    opacity: 0.38;
  }

  .corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border-color: rgba(120,255,120,0.35);
    border-style: solid;
    filter: drop-shadow(0 0 6px rgba(120,255,120,0.18));
  }

  .tl { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
  .tr { top: 16px; right: 16px; border-width: 2px 2px 0 0; }
  .bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
  .br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

  /* Сканирующая вертикальная полоса */
  .sweep {
    opacity: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(120,255,120,0.04) 35%,
      rgba(120,255,120,0.16) 50%,
      rgba(120,255,120,0.04) 65%,
      transparent 100%
    );
    animation: sweep 9s linear infinite;
    mix-blend-mode: screen;
  }

  /* Вспышка радиации */
  .flash {
    opacity: 0;
    background:
      radial-gradient(circle at center,
        rgba(120,255,120,0.18) 0%,
        rgba(120,255,120,0.08) 24%,
        rgba(120,255,120,0.03) 42%,
        transparent 68%);
    mix-blend-mode: screen;
  }

  /* Горизонтальная помеха */
  .glitch-band {
    position: absolute;
    left: 0;
    width: 100%;
    height: 48px;
    opacity: 0;
    background:
      linear-gradient(
        to bottom,
        rgba(120,255,120,0.02),
        rgba(120,255,120,0.14),
        rgba(255,255,255,0.04),
        rgba(120,255,120,0.02)
      );
    filter: blur(1px);
    mix-blend-mode: screen;
  }

  /* RGB/HUD сдвиг */
  .rgb-shift {
    opacity: 0;
    mix-blend-mode: screen;
    background:
      linear-gradient(90deg,
        transparent 0%,
        rgba(120,255,120,0.06) 20%,
        rgba(255,255,255,0.04) 50%,
        rgba(120,255,120,0.06) 80%,
        transparent 100%);
    transform: translateX(0);
  }

  @keyframes scanDrift {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  @keyframes noiseShift {
    0% { transform: translate(0, 0); opacity: 0.06; }
    50% { transform: translate(1px, -1px); opacity: 0.09; }
    100% { transform: translate(-1px, 1px); opacity: 0.07; }
  }

  @keyframes fogMove {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(12px, -8px) scale(1.03); }
    100% { transform: translate(-8px, 10px) scale(0.98); }
  }

  @keyframes sweep {
    0% {
      transform: translateX(-120%);
      opacity: 0;
    }
    8% {
      opacity: 0.22;
    }
    14% {
      opacity: 0;
    }
    100% {
      transform: translateX(140%);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="layer tint"></div>
  <div class="layer fog"></div>
  <div class="layer scanlines"></div>
  <div class="layer noise"></div>
  <div class="layer sweep" id="sweep"></div>
  <div class="layer flash" id="flash"></div>
  <div class="glitch-band" id="glitchBand"></div>
  <div class="layer rgb-shift" id="rgbShift"></div>
  <div class="layer hud"></div>
  <div class="layer corners">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
  <div class="layer vignette"></div>

<script>
  const flash = document.getElementById("flash");
  const glitchBand = document.getElementById("glitchBand");
  const rgbShift = document.getElementById("rgbShift");

  function radiationPulse() {
    flash.style.opacity = "1";
    setTimeout(() => {
      flash.style.opacity = "0";
    }, 120);
  }

  function bandGlitch() {
    const y = Math.floor(Math.random() * window.innerHeight * 0.8);
    const h = 28 + Math.floor(Math.random() * 42);

    glitchBand.style.top = y + "px";
    glitchBand.style.height = h + "px";
    glitchBand.style.opacity = "0.75";

    setTimeout(() => {
      glitchBand.style.opacity = "0";
    }, 90 + Math.floor(Math.random() * 90));
  }

  function cameraDistort() {
    rgbShift.style.opacity = "0.45";
    rgbShift.style.transform = "translateX(" + (Math.random() > 0.5 ? 4 : -4) + "px)";

    setTimeout(() => {
      rgbShift.style.opacity = "0";
      rgbShift.style.transform = "translateX(0)";
    }, 70);
  }

  function randomEvent() {
    const r = Math.random();

    if (r < 0.28) {
      radiationPulse();
    }

    if (r < 0.22) {
      bandGlitch();
    }

    if (r < 0.16) {
      cameraDistort();
    }

    if (r < 0.08) {
      radiationPulse();
      bandGlitch();
      cameraDistort();
    }
  }

  setInterval(randomEvent, 1800);
</script>
</body>
</html>
