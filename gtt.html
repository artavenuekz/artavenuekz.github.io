<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STALKER Webcam Radiation FX</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    pointer-events: none;
  }

  .layer, canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background: transparent;
  }

  .tint {
    background:
      radial-gradient(circle at 50% 50%,
        rgba(120,255,120,0.03) 0%,
        rgba(120,255,120,0.02) 35%,
        rgba(120,255,120,0.01) 60%,
        transparent 100%);
    mix-blend-mode: screen;
    opacity: 0.9;
  }

  .scanlines {
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(120,255,120,0.05) 0px,
        rgba(120,255,120,0.05) 1px,
        transparent 2px,
        transparent 4px
      );
    opacity: 0.18;
    animation: scanDrift 7s linear infinite;
    mix-blend-mode: screen;
  }

  .noise {
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(120,255,120,0.07) 0 1px, transparent 1.6px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.05) 0 1px, transparent 1.4px),
      radial-gradient(circle at 85% 20%, rgba(120,255,120,0.05) 0 1px, transparent 1.5px);
    background-size: 180px 120px, 220px 160px, 200px 140px, 160px 130px;
    opacity: 0.05;
    animation: noiseShift 0.35s steps(2) infinite;
    mix-blend-mode: screen;
  }

  .fog {
    background:
      radial-gradient(circle at 18% 32%, rgba(120,255,120,0.05) 0%, transparent 30%),
      radial-gradient(circle at 76% 28%, rgba(120,255,120,0.04) 0%, transparent 26%),
      radial-gradient(circle at 52% 78%, rgba(120,255,120,0.035) 0%, transparent 32%);
    opacity: 0.28;
    filter: blur(18px);
    animation: fogMove 14s ease-in-out infinite alternate;
    mix-blend-mode: screen;
  }

  .flash {
    opacity: 0;
    background:
      radial-gradient(circle at center,
        rgba(120,255,120,0.10) 0%,
        rgba(120,255,120,0.05) 28%,
        rgba(120,255,120,0.02) 46%,
        transparent 68%);
    mix-blend-mode: screen;
  }

  .sweep {
    opacity: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(120,255,120,0.03) 35%,
      rgba(120,255,120,0.12) 50%,
      rgba(120,255,120,0.03) 65%,
      transparent 100%
    );
    animation: sweep 9s linear infinite;
    mix-blend-mode: screen;
  }

  .glitch-band {
    position: absolute;
    left: 0;
    width: 100%;
    height: 42px;
    opacity: 0;
    background:
      linear-gradient(
        to bottom,
        rgba(120,255,120,0.01),
        rgba(120,255,120,0.10),
        rgba(255,255,255,0.03),
        rgba(120,255,120,0.01)
      );
    filter: blur(1px);
    mix-blend-mode: screen;
  }

  .rgb-shift {
    opacity: 0;
    mix-blend-mode: screen;
    background:
      linear-gradient(
        90deg,
        transparent 0%,
        rgba(120,255,120,0.04) 25%,
        rgba(255,255,255,0.03) 50%,
        rgba(120,255,120,0.04) 75%,
        transparent 100%
      );
    transform: translateX(0);
  }

  .vignette {
    background:
      radial-gradient(circle at center,
        transparent 52%,
        rgba(0,0,0,0.06) 72%,
        rgba(0,0,0,0.16) 100%);
  }

  @keyframes scanDrift {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
  }

  @keyframes noiseShift {
    0% { transform: translate(0, 0); opacity: 0.04; }
    50% { transform: translate(1px, -1px); opacity: 0.07; }
    100% { transform: translate(-1px, 1px); opacity: 0.05; }
  }

  @keyframes fogMove {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(12px, -8px) scale(1.03); }
    100% { transform: translate(-8px, 10px) scale(0.98); }
  }

  @keyframes sweep {
    0% {
      transform: translateX(-120%);
      opacity: 0;
    }
    8% {
      opacity: 0.16;
    }
    14% {
      opacity: 0;
    }
    100% {
      transform: translateX(140%);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="layer tint"></div>
  <div class="layer fog"></div>
  <div class="layer scanlines"></div>
  <div class="layer noise"></div>
  <div class="layer sweep" id="sweep"></div>
  <div class="layer flash" id="flash"></div>
  <div class="glitch-band" id="glitchBand"></div>
  <div class="layer rgb-shift" id="rgbShift"></div>
  <div class="layer vignette"></div>

<script>
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");

  const flash = document.getElementById("flash");
  const glitchBand = document.getElementById("glitchBand");
  const rgbShift = document.getElementById("rgbShift");

  let w = 0;
  let h = 0;
  let particles = [];

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    createParticles();
  }

  function createParticles() {
    particles = [];
    const count = Math.floor((w * h) / 11000);

    for (let i = 0; i < count; i++) {
      particles.push({
        x: rand(0, w),
        y: rand(0, h),
        r: rand(0.45, 1.6),
        a: rand(0.22, 0.95),
        vx: rand(-0.06, 0.06),
        vy: rand(0.03, 0.16),
        tw: rand(0.01, 0.05),
        phase: rand(0, Math.PI * 2)
      });
    }
  }

  function drawParticle(p, t) {
    const alpha = p.a * (0.68 + Math.sin(t * p.tw + p.phase) * 0.32);

    ctx.beginPath();
    ctx.fillStyle = "rgba(255,255,255," + alpha + ")";
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    if (p.r > 1.1) {
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255," + (alpha * 0.16) + ")";
      ctx.arc(p.x, p.y, p.r * 2.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateParticle(p) {
    p.x += p.vx;
    p.y += p.vy;

    if (Math.random() < 0.006) {
      p.vx += rand(-0.025, 0.025);
      p.vy += rand(-0.015, 0.015);
    }

    p.vx = Math.max(-0.14, Math.min(0.14, p.vx));
    p.vy = Math.max(0.02, Math.min(0.22, p.vy));

    if (p.y > h + 12) {
      p.y = -12;
      p.x = rand(0, w);
    }

    if (p.x < -12) p.x = w + 12;
    if (p.x > w + 12) p.x = -12;
  }

  function animateParticles(time) {
    const t = time * 0.06;
    ctx.clearRect(0, 0, w, h);

    for (const p of particles) {
      updateParticle(p);
      drawParticle(p, t);
    }

    requestAnimationFrame(animateParticles);
  }

  function radiationPulse() {
    flash.style.opacity = "1";
    setTimeout(() => {
      flash.style.opacity = "0";
    }, 120);
  }

  function bandGlitch() {
    const y = Math.floor(Math.random() * h * 0.8);
    const height = 24 + Math.floor(Math.random() * 38);

    glitchBand.style.top = y + "px";
    glitchBand.style.height = height + "px";
    glitchBand.style.opacity = "0.65";

    setTimeout(() => {
      glitchBand.style.opacity = "0";
    }, 90 + Math.floor(Math.random() * 80));
  }

  function cameraDistort() {
    rgbShift.style.opacity = "0.35";
    rgbShift.style.transform = "translateX(" + (Math.random() > 0.5 ? 3 : -3) + "px)";

    setTimeout(() => {
      rgbShift.style.opacity = "0";
      rgbShift.style.transform = "translateX(0)";
    }, 70);
  }

  function randomEvent() {
    const r = Math.random();

    if (r < 0.24) radiationPulse();
    if (r < 0.18) bandGlitch();
    if (r < 0.12) cameraDistort();

    if (r < 0.05) {
      radiationPulse();
      bandGlitch();
      cameraDistort();
    }
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(animateParticles);
  setInterval(randomEvent, 1800);
</script>
</body>
</html>
